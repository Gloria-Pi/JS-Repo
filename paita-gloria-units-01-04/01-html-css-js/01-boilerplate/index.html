<!DOCTYPE html>         <!-- tells the browser that it's an HTML5 page -->
<html lang="en">        <!-- tells the browser that the page is in English, actual start of the html -->
    
<head>                                                                          <!-- this is where the metadata is stored -->
    <meta charset="UTF-8">                                                      <!-- tells the browser to use UTF-8 to decode the page -->
    <!-- <meta http-equiv="X-UA-Compatible" content="ie=edge"> -->              <!-- OPTIONAL! Tells the browser that Edge is the highest supported mode when it comes to which version of IE can run this webpage -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">      <!-- renders the width of the page to the width of the device's screen size ("1.0" prevents the default zoom by browsers) -->
    
    <title>Tab Title Of My Page</title>                                         <!-- what appears as the Tab title -->
    
    <meta name="description" content="Gloria Paita's HTML5 Boilerplate.">       <!-- the description of the webpage -->
    <meta name="author" content="Gloria Paita">                                 <!-- the name of the webpage's creator -->
    
    <!-- Not including these yet. All of these tags will enhance the appearance of the web page when it's linked in a social media post. In order, these are: title, type, URL, description, image

    <meta property="og:title" content="My HTML5 Boilerplate">                               
    <meta property="og:type" content="website">                                             
    <meta property="og:url" content="https://www.sitepoint.com/a-basic-html5-template/">    
    <meta property="og:description" content="Gloria Paita's HTML5 boilerplate.">            
    <meta property="og:image" content="image.png">

    -->

    <link rel="icon" href="/favicon.svg" type="image/svg+xml">                  <!-- sets the svg version of the favicon of the webpage (for modern browsers) -->
    <link rel="icon" href="/favicon.ico">                                       <!-- sets the favicon of the webpage (for legacy browsers)-->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">                  <!-- references the icon that's used on Apple devices when the page is added to the user's home screen -->
    <link rel="icon" sizes="192x192" href="/icons/android-icon-192x192.png">    <!-- references the icon that's going to be used on Android devices when the page is added to the user's home screen, specifying that it's going to be 192x192 px (usually it's either 192x192 or 512x512)-->

    
    <link rel="stylesheet" href="styles.css?v=1.0">                             <!-- tells where it can find the related, external CSS file (nonexistent as of now), and says that it's version 1 of that file -->
    <!-- <script src="scripts.js"></scripts> -->                                <!-- OPTIONAL placement of script element; it's more commonly found before the end of the <body> element  -->
   
</head>

<body>
    <!-- this is where I'll put my content -->
    <h1>Title of the Page</h1>                          <!-- header 1 -->
    
    <!-- end of the body -->
    <script src="./js/scripts.js"></script>            <!-- tells the browser where it can find my external JavaScript code (as of now, nonexistent)-->
</body>

</html>             <!-- end of the html file-->
